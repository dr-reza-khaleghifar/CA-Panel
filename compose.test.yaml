name: ca-panel-testbed

# This is a separate Compose project. It never imports or overrides compose.yaml.
# All published ports are loopback-only; no public listener is created.
services:
  api:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.75
    ports:
      - "127.0.0.1:${TEST_API_PORT:-18080}:8000"
    environment:
      DB_PATH: /data/ca-panel-test.sqlite3
      CA_DIR: /run/ca-test
      CA_KEY_PASSWORD: "${CA_KEY_PASSWORD:?Set CA_KEY_PASSWORD in .env.test}"
      CA_DISPLAY_NAME: "${CA_DISPLAY_NAME:-CA-Panel Test}"
      CA_ORGANIZATION: "${CA_ORGANIZATION:-Private Test CA}"
      CA_ISSUER_KEY_FILE: "${CA_ISSUER_KEY_FILE:-issuer-key.pem}"
      CA_ISSUER_CERT_FILE: "${CA_ISSUER_CERT_FILE:-issuer-cert.pem}"
      CA_ROOT_CERT_FILE: "${CA_ROOT_CERT_FILE:-root-cert.pem}"
      CERT_VALIDITY_DAYS: "${CERT_VALIDITY_DAYS:-30}"
      SERVER_KEY_BITS: "${SERVER_KEY_BITS:-2048}"
      CHALLENGE_SECONDS: "${CHALLENGE_SECONDS:-3600}"
      MAX_REQUESTS_PER_HOUR: "${MAX_REQUESTS_PER_HOUR:-20}"
      MAX_TOTAL_PER_HOUR: "${MAX_TOTAL_PER_HOUR:-200}"
      MAX_VERIFICATIONS: "${MAX_VERIFICATIONS:-10}"
      DOWNLOAD_TTL_SECONDS: "${DOWNLOAD_TTL_SECONDS:-600}"
      MAX_PENDING_DOWNLOADS: "${MAX_PENDING_DOWNLOADS:-100}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_TOTP_SECRET: "${ADMIN_TOTP_SECRET:-}"
      ADMIN_SESSION_GENERATION: "${ADMIN_SESSION_GENERATION:-}"
      CERT_ALLOWED_DOMAINS: "${CERT_ALLOWED_DOMAINS:-}"
      CERT_ALLOW_ANY_DOMAIN: "${CERT_ALLOW_ANY_DOMAIN:-0}"
      TRUST_PROXY_HEADERS: "0"
      DNS_RESOLVERS: "${DNS_RESOLVERS:-}"
    volumes:
      - ${DATA_HOST_DIR:-./.testbed/data}:/data
      - ${CA_ONLINE_HOST_DIR:-./.testbed/pki/online}:/run/ca-test:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy-test:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_HTTPS_PORT:-18443}:8443"
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN:-ca-panel-test.iravand.ir}"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
      - ${PANEL_TLS_HOST_DIR:-./.testbed/secrets/tls}:/etc/caddy/tls:ro
      - caddy_test_data:/data
      - caddy_test_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

volumes:
  caddy_test_data:
  caddy_test_config:
