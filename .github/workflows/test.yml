name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts

  security:
    name: Dependency and static security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security scanners
        run: python -m pip install pip-audit bandit
      - name: Audit Python dependencies against published advisories
        run: python -m pip_audit -r requirements.txt --strict
      - name: Static security scan of application and operator scripts
        run: bandit -q -r app scripts -ll -ii
