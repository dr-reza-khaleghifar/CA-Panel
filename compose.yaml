services:
  api:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.75
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DB_PATH: /data/ca-panel.sqlite3
      CA_DIR: /run/ca
      CA_KEY_PASSWORD: "${CA_KEY_PASSWORD:?Set CA_KEY_PASSWORD in .env}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-0}"
      DNS_RESOLVERS: "${DNS_RESOLVERS:-}"
    volumes:
      - ./data:/data
      - ./secrets/online:/run/ca:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN:-ca.example.org}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
