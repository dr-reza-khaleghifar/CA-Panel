services:
  api:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.75
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DB_PATH: "${DB_PATH:-/data/ca-panel.sqlite3}"
      CA_DIR: "${CA_DIR:-/run/ca}"
      CA_KEY_PASSWORD: "${CA_KEY_PASSWORD:?Set CA_KEY_PASSWORD in .env}"
      CA_DISPLAY_NAME: "${CA_DISPLAY_NAME:-CA-Panel}"
      CA_ORGANIZATION: "${CA_ORGANIZATION:-Private CA}"
      CA_ISSUER_KEY_FILE: "${CA_ISSUER_KEY_FILE:-issuer-key.pem}"
      CA_ISSUER_CERT_FILE: "${CA_ISSUER_CERT_FILE:-issuer-cert.pem}"
      CA_ROOT_CERT_FILE: "${CA_ROOT_CERT_FILE:-root-cert.pem}"
      CERT_VALIDITY_DAYS: "${CERT_VALIDITY_DAYS:-30}"
      SERVER_KEY_BITS: "${SERVER_KEY_BITS:-2048}"
      CHALLENGE_SECONDS: "${CHALLENGE_SECONDS:-3600}"
      MAX_REQUESTS_PER_HOUR: "${MAX_REQUESTS_PER_HOUR:-20}"
      MAX_TOTAL_PER_HOUR: "${MAX_TOTAL_PER_HOUR:-200}"
      MAX_VERIFICATIONS: "${MAX_VERIFICATIONS:-10}"
      DOWNLOAD_TTL_SECONDS: "${DOWNLOAD_TTL_SECONDS:-600}"
      MAX_PENDING_DOWNLOADS: "${MAX_PENDING_DOWNLOADS:-100}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      ADMIN_TOTP_SECRET: "${ADMIN_TOTP_SECRET:-}"
      ADMIN_SESSION_GENERATION: "${ADMIN_SESSION_GENERATION:-}"
      CERT_ALLOWED_DOMAINS: "${CERT_ALLOWED_DOMAINS:-}"
      CERT_ALLOW_ANY_DOMAIN: "${CERT_ALLOW_ANY_DOMAIN:-0}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-0}"
      DNS_RESOLVERS: "${DNS_RESOLVERS:-}"
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
      - ${CA_ONLINE_HOST_DIR:-./secrets/online}:${CA_DIR:-/run/ca}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # HTTPS with the certificate issued by YOUR own Issuing CA.
  # Start using: docker compose --profile private-tls up -d --build api caddy-private
  # Keep this profile mutually exclusive with the existing public/ACME Caddy.
  caddy-private:
    image: caddy:2.10
    profiles: ["private-tls"]
    restart: unless-stopped
    ports:
      - "${PANEL_TLS_BIND_IP:-0.0.0.0}:443:443"
      - "${PANEL_TLS_BIND_IP:-0.0.0.0}:443:443/udp"
      # HTTP provides ONLY static CA trust onboarding; no admin/API reverse proxy.
      - "${PANEL_HTTP_BIND_IP:-0.0.0.0}:80:80"
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN:-ca1.iravand.ir}"
    volumes:
      - ./Caddyfile.private:/etc/caddy/Caddyfile:ro
      - ${PANEL_TLS_HOST_DIR:-./secrets/tls}:/etc/caddy/tls:ro
      # Whitelisted HTTP static files; do not mount .env or the issuer key.
      - ./app/static/trust.html:/srv/onboarding/index.html:ro
      - ./app/static/trust.css:/srv/onboarding/trust.css:ro
      - ${CA_ONLINE_HOST_DIR:-./secrets/online}/${CA_ROOT_CERT_FILE:-root-cert.pem}:/srv/onboarding/root-ca.pem:ro
      - caddy_private_data:/data
      - caddy_private_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

  caddy:
    image: caddy:2.10
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN:-ca.example.org}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
  caddy_private_data:
  caddy_private_config:
